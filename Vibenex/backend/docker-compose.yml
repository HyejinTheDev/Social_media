version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: vibenex_db
    restart: unless-stopped
    ports:
      - '5434:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
      POSTGRES_DB: vibenex
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
