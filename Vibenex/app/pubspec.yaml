name: vibenex
description: Vibenex - Social Media App

publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_bloc: ^8.1.4
  equatable: ^2.0.5

  # Dependency Injection
  get_it: ^7.6.7
  injectable: ^2.3.2

  # Networking
  dio: ^5.4.1
  retrofit: 4.6.0
  json_annotation: ^4.9.0

  # Code Generation
  freezed_annotation: ^3.0.0

  # Local Storage
  shared_preferences: ^2.5.5
  flutter_secure_storage: ^9.0.0

  # UI
  google_fonts: ^6.1.0
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  flutter_svg: ^2.0.9
  lottie: ^3.1.0
  flutter_animate: ^4.5.0
  photo_view: ^0.15.0

  # Navigation
  go_router: ^13.2.0

  # Media
  image_picker: ^1.2.2
  video_player: ^2.8.3
  video_compress: ^3.1.2

  # Utils
  intl: ^0.20.2
  url_launcher: ^6.2.4
  timeago: ^3.6.1
  uuid: ^4.3.3
  connectivity_plus: 6.1.0

  # Realtime Chat
  socket_io_client: ^3.0.2

  cupertino_icons: ^1.0.6
  desktop_drop: ^0.7.1
  visibility_detector: ^0.4.0+2
  badges: ^3.2.0
  fl_chart: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

  # Code Generation
  build_runner: ^2.4.8
  freezed: ^3.0.0
  json_serializable: ^6.8.0
  retrofit_generator: 10.0.2
  injectable_generator: ^2.4.1
  bloc_test: ^9.1.7

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/lottie/
